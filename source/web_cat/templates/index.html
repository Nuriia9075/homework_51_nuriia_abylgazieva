<!DOCTYPE html><html lang="ru"><head>    <meta charset="UTF-8">    <title>Cats</title>   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></head><body class="bg-light d-flex align-items-center justify-content-center vh-100">    <div class="card p-5 shadow-sm" style="max-width: 500px; width: 100%; min-height: 300px;">      <div class="card-body text-center d-flex flex-column justify-content-center">        <h3 class="card-title fw-bold mb-4">            Вас приветствует симулятор кота,<br>            <span class="text-muted fs-6 fw-normal">для начала введите имя кота</span>        </h3>        <form action="cat_stats/" method="POST">            {% csrf_token %}            <div class="mb-4">                <input type="text" name="cat_name" class="form-control form-control-lg text-center" placeholder="Имя котика" required>            </div>            <button type="submit" class="btn btn-primary btn-lg w-100">Создать</button>        </form>      </div>    </div></body></html>
