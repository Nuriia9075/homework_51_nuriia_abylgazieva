{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика кота</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card mb-3 p-5 shadow-sm" style="max-width: 1050px; min-height: 600px; width: 100%;">
      <div class="row g-0 align-items-center" style="min-height: 500px;">
        <div class="col-md-5 text-center">
            <img src="{% static cat.stat %}" class="img-fluid rounded shadow-sm" style="max-width: 380px; height: auto;" alt="Кот">
        </div>
        <div class="col-md-7 ps-md-4">
          <div class="card-body">
              <h3 class="card-title mb-4">Характеристики</h3>
              <h5 class="card-text mb-2">Имя: <strong>{{ cat.name }}</strong></h5>
              <h5 class="card-text mb-2">Возраст: <strong>{{ cat.age }}</strong></h5>
              <h5 class="card-text mb-2">Уровень счастья: <strong>{{ cat.lv_happy }} </strong></h5>
              <h5 class="card-text mb-4">Уровень сытости: <strong>{{ cat.lv_satiety }}</strong></h5>
              <h5 class="card-text mb-4">Состояние: <strong> {% if cat.sleeping %}Спит{% else %}Бодрствует{% endif %}</strong></h5>
          </div>
        </div>
      </div>
            <form method="POST" class="mt-4">
                {% csrf_token %}
                <div class="input-group input-group-lg">
                    <select name="action" class="form-select">
                        <option value="play">Поиграть с котиком</option>
                        <option value="feed">Покормить котика</option>
                        <option value="sleep">
                            {% if cat.sleeping %}Разбудить котика{% else %}Уложить спать{% endif %}
                        </option>
                    </select>
                    <button type="submit" class="btn btn-primary">Подтвердить</button>
                </div>
            </form>
    </div>
</body>
</html>
